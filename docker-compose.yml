# DailyDrop — local dev stack
# Postgres stays on Supabase (cloud). Redis + API run in containers.
#
# Start:  docker compose up --build
# Stop:   docker compose down

services:
  redis:
    image: redis:7-alpine
    container_name: dailydrop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailydrop-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Catalog cache — FastAPI reads this inside the container
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Mount source so code changes apply without rebuilding the image
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
